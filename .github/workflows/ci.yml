name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-02-01
          targets: wasm32-unknown-unknown
      - name: Cache cargo-odra
        id: cache-cargo-odra
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-odra
          key: cargo-odra-0.1.7
      - name: Install cargo-odra
        if: steps.cache-cargo-odra.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup run stable cargo install cargo-odra@0.1.7 --locked
      - name: Run contract tests
        working-directory: smart-contract
        run: cargo odra test
